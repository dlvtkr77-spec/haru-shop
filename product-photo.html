<main><div class="wrap">
  <p id="photo-login" hidden>로그인해 주세요.</p>
  <section id="photo-content" hidden>
    <h1>상품 사진 올리기</h1>
    <form id="photo-form">
      <p><label for="photo-product">상품 (문서 ID)</label><br>
      <select id="photo-product" required disabled></select></p>
      <p><label for="photo-file">사진 파일</label><br>
      <input id="photo-file" type="file" accept="image/*" required></p>
      <button class="btn" id="photo-submit" type="submit" disabled>사진 올리기</button>
    </form>
  </section>
  <p id="photo-status" role="status" style="white-space: pre-wrap; overflow-wrap: anywhere;"></p>
</div></main>
<script type="module" src="assets/product-photo.js"></script>
