<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>관리 화면 · 하루상점</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    [hidden] { display: none !important; }
    #admin-error { white-space: pre-wrap; overflow-wrap: anywhere; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    .product-photo { width: 64px; height: 64px; object-fit: contain; }
    .product-error { white-space: pre-wrap; overflow-wrap: anywhere; }
    .product-form { display: grid; gap: 10px; margin: 16px 0; }
    .product-form label { display: grid; gap: 4px; }
    .btn:disabled { opacity: .6; cursor: wait; }
  </style>

<body>

  <main><div class="wrap">
    <h1>관리 화면</h1>
    <p id="admin-status" role="status" aria-live="polite">확인 중입니다.</p>
    <a id="login-link" href="/login.html" hidden>로그인</a>
    <button class="btn" id="grant-owner" type="button" hidden>주인 명찰 받기</button>
    <p id="admin-error" role="alert" hidden></p>
    <p><button class="btn ghost" id="refresh-role" type="button" hidden>다시 확인</button></p>
    <section id="products-admin" hidden>
      <h2>상품 관리</h2>
      <button class="btn" id="new-product" type="button">새 상품</button>
      <div id="new-product-editor" hidden></div>
      <p id="products-status" class="product-error" role="status"></p>
      <div role="group" aria-label="상품 필터">
        <button type="button" id="filter-all" aria-pressed="true">전체</button>
        <button type="button" id="filter-stock" aria-pressed="false">품절만</button>
        <button type="button" id="filter-hidden" aria-pressed="false">숨김만</button>
      </div>
      <p><label>이름 검색 <input id="product-search" type="search"></label>
      <label>정렬 <select id="product-sort">
        <option value="stock">재고 적은 순</option>
        <option value="name">이름순</option>
      </select></label></p>
      <p id="products-count" role="status">지금 보이는 상품 0개 / 전체 0개</p>
      <div class="table-scroll">
        <table>
          <thead><tr><th>사진</th><th>문서 ID</th><th>name</th><th>price</th><th>stock</th><th>품절</th><th>노출</th><th>수정</th><th>오류</th></tr></thead>
          <tbody id="products-body"></tbody>
        </table>
      </div>
    </section>
  </div></main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, getIdTokenResult } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";

    import { getFirestore, collection, getDocsFromServer, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

    const firebaseConfig = {
    apiKey: "AIzaSyAwz8FywtpJ20DpWW7Sc3OuvyGm7pDmIpo",
    authDomain: "haru-shop-4083f.firebaseapp.com",
    projectId: "haru-shop-4083f",
    storageBucket: "haru-shop-4083f.firebasestorage.app",
    messagingSenderId: "1058982124810",
    appId: "1:1058982124810:web:bc866184877dd494442ef3"
  };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const grantOwnerRole = httpsCallable(getFunctions(app, "us-central1"), "grantOwnerRole");
    const status = document.getElementById("admin-status");
    const loginLink = document.getElementById("login-link");
    const grantButton = document.getElementById("grant-owner");
    const refreshButton = document.getElementById("refresh-role");
    const errorBox = document.getElementById("admin-error");
    const db = getFirestore(app);
    const storage = getStorage(app);
    const productsPanel = document.getElementById("products-admin");
    const productsBody = document.getElementById("products-body");
    const productsStatus = document.getElementById("products-status");
    const newEditor = document.getElementById("new-product-editor");
    const searchInput = document.getElementById("product-search");
    const sortSelect = document.getElementById("product-sort");
    const productsCount = document.getElementById("products-count");
    const filterButtons = [
      ["all", document.getElementById("filter-all")],
      ["stock", document.getElementById("filter-stock")],
      ["hidden", document.getElementById("filter-hidden")]
    ];
    let productFilter = "all";
    let productEntries = [];
    let productsAllowed = false;
    let revision = 0;
    let busy = false;

    function showError(error) {
      errorBox.textContent = error?.message ?? String(error);
      errorBox.hidden = false;
    }

    async function checkRole(forceRefresh = false, grant = false) {
      const currentRevision = ++revision;
      const user = auth.currentUser;
      busy = true;
      productsAllowed = false;
      productsPanel.hidden = true;
      productsBody.replaceChildren();
      productEntries = [];
      productsCount.textContent = "지금 보이는 상품 0개 / 전체 0개";
      newEditor.replaceChildren();
      newEditor.hidden = true;
      grantButton.hidden = true;
      loginLink.hidden = true;
      refreshButton.hidden = !user;
      grantButton.disabled = true;
      refreshButton.disabled = true;
      errorBox.hidden = true;
      errorBox.textContent = "";
      status.textContent = user ? "확인 중입니다." : "로그인이 필요합니다";
      loginLink.hidden = !!user;
      try {
        if (!user) return;
        if (grant) await grantOwnerRole();
        const token = await getIdTokenResult(user, forceRefresh);
        if (currentRevision !== revision || auth.currentUser !== user) return;
        const role = token.claims.role;
        const allowed = role === "staff" || role === "admin";
        status.textContent = allowed ? `관리자: ${role}` : "권한이 없습니다";
        grantButton.hidden = allowed;
        productsAllowed = allowed;
        productsPanel.hidden = !allowed;
        if (allowed) void loadAdminProducts(currentRevision);
      } catch (error) {
        if (currentRevision !== revision || auth.currentUser !== user) return;
        status.textContent = grant ? "권한이 없습니다" : "권한을 확인하지 못했습니다";
        grantButton.hidden = !grant;
        showError(error);
      } finally {
        if (currentRevision === revision) {
          busy = false;
          grantButton.disabled = false;
          refreshButton.disabled = false;
        }
      }
    }

    function element(tag, text) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function numericValue(input, label, minimum, integer = false) {
      const value = Number(input.value);
      if (!input.value.trim() || !Number.isFinite(value) || value < minimum ||
          (integer && !Number.isSafeInteger(value))) {
        throw new Error(`${label}: ${minimum} 이상의 ${integer ? "정수" : "숫자"}를 입력해 주세요.`);
      }
      return value;
    }

    function validatePhoto(file) {
      if (!file) return;
      if (file.size >= 5 * 1024 * 1024) throw new Error("5MB 넘는 사진은 올릴 수 없습니다");
      if (!file.type.startsWith("image/")) throw new Error("이미지 파일만 올릴 수 있습니다");
    }

    async function uploadPhoto(productId, file, progress) {
      validatePhoto(file);
      const imagePath = `products/${productId}/main.jpg`;
      progress.textContent = "올리는 중 … 0%";
      const task = uploadBytesResumable(ref(storage, imagePath), file);
      await new Promise((resolve, reject) => {
        task.on("state_changed", snapshot => {
          const percent = snapshot.totalBytes === 0 ? 100
            : Math.round(snapshot.bytesTransferred / snapshot.totalBytes * 100);
          progress.textContent = `올리는 중 … ${percent}%`;
        }, reject, resolve);
      });
      await updateDoc(doc(db, "products", productId), { imagePath });
      progress.textContent = "사진을 올리고 저장했습니다.";
      return imagePath;
    }

    async function paintPhoto(cell, product) {
      cell.replaceChildren();
      if (!product.imagePath) return;
      try {
        const url = await getDownloadURL(ref(storage, product.imagePath));
        const image = element("img");
        image.className = "product-photo";
        image.alt = product.name ?? "상품 사진";
        image.src = url;
        cell.replaceChildren(image);
      } catch (failure) {
        cell.textContent = failure?.message ?? String(failure);
      }
    }

    function productForm(product, creating, save) {
      const form = element("form");
      form.className = "product-form";
      const inputs = {};
      for (const key of creating ? ["name", "price", "summary", "stock"] : ["price", "summary", "stock"]) {
        const label = element("label", key);
        const input = element(key === "summary" ? "textarea" : "input");
        input.value = product[key] ?? "";
        if (key === "price" || key === "stock") {
          input.type = "number";
          input.min = key === "price" ? "0.0000001" : "0";
          input.step = key === "stock" ? "1" : "any";
        }
        input.required = key !== "summary";
        label.append(input);
        form.append(label);
        inputs[key] = input;
      }
      const photoLabel = element("label", "사진");
      const photo = element("input");
      photo.type = "file";
      photo.accept = "image/*";
      photoLabel.append(photo);
      const progress = element("p");
      progress.setAttribute("role", "status");
      form.append(photoLabel, progress);
      let submitting = false;
      const submit = element("button", "저장");
      submit.type = "submit";
      submit.className = "btn";
      const cancel = element("button", "취소");
      cancel.type = "button";
      cancel.addEventListener("click", () => form.remove());
      const error = element("p");
      error.className = "product-error";
      error.setAttribute("role", "alert");
      form.append(submit, cancel, error);
      photo.addEventListener("change", () => {
        error.textContent = "";
        try { validatePhoto(photo.files[0]); }
        catch (failure) { error.textContent = failure.message; }
      });
      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (submitting) return;
        submitting = true;
        error.textContent = "";
        submit.disabled = cancel.disabled = photo.disabled = true;
        try {
          if (!productsAllowed) throw new Error("권한이 없습니다");
          const file = photo.files[0];
          validatePhoto(file);
          const price = numericValue(inputs.price, "price", 0);
          if (price <= 0) throw new Error("price: 0보다 큰 숫자를 입력해 주세요.");
          const data = { price, summary: inputs.summary.value, stock: numericValue(inputs.stock, "stock", 0, true) };
          if (creating) {
            data.name = inputs.name.value.trim();
            if (!data.name) throw new Error("name을 입력해 주세요.");
          }
          await save(data, file, progress);
          form.remove();
        } catch (failure) {
          error.textContent = failure?.message ?? String(failure);
        } finally {
          submitting = false;
          submit.disabled = cancel.disabled = photo.disabled = false;
        }
      });
      return form;
    }

    function productRow(snapshot) {
      const product = snapshot.data();
      const row = element("tr");
      const photoCell = element("td");
      photoCell.className = "product-error";
      row.append(photoCell);
      void paintPhoto(photoCell, product);
      const cells = {};
      for (const key of ["id", "name", "price", "stock"]) {
        cells[key] = element("td", key === "id" ? snapshot.id : product[key]);
        row.append(cells[key]);
      }
      const soldOut = element("input");
      soldOut.type = "checkbox";
      soldOut.checked = product.stock === 0;
      soldOut.setAttribute("aria-label", `${snapshot.id} 품절`);
      const visible = element("input");
      visible.type = "checkbox";
      visible.checked = product.isVisible === true;
      visible.setAttribute("aria-label", `${snapshot.id} 노출`);
      const edit = element("button", "고치기");
      edit.type = "button";
      const editCell = element("td");
      for (const control of [soldOut, visible]) {
        const cell = element("td"); cell.append(control); row.append(cell);
      }
      editCell.append(edit); row.append(editCell);
      const error = element("td");
      error.className = "product-error";
      error.setAttribute("role", "alert");
      row.append(error);
      let saving = false;
      async function save(data) {
        if (saving) throw new Error("저장 중입니다.");
        if (!productsAllowed) throw new Error("권한이 없습니다");
        saving = true;
        error.textContent = "";
        soldOut.disabled = visible.disabled = edit.disabled = true;
        try {
          await updateDoc(doc(db, "products", snapshot.id), data);
          Object.assign(product, data);
          cells.price.textContent = product.price;
          cells.stock.textContent = product.stock;
          renderAdminProducts();
        } catch (failure) {
          error.textContent = failure?.message ?? String(failure);
          throw failure;
        } finally {
          soldOut.checked = product.stock === 0;
          visible.checked = product.isVisible === true;
          saving = false;
          soldOut.disabled = visible.disabled = edit.disabled = false;
        }
      }
      soldOut.addEventListener("change", async () => {
        try {
          let stock = 0;
          if (!soldOut.checked) {
            const answer = window.prompt("재고 숫자(1 이상 정수)를 입력해 주세요.");
            if (answer === null) { soldOut.checked = product.stock === 0; return; }
            stock = numericValue({value: answer}, "stock", 1, true);
          }
          await save({stock});
        } catch (failure) {
          error.textContent = failure?.message ?? String(failure);
          soldOut.checked = product.stock === 0;
        }
      });
      visible.addEventListener("change", async () => {
        try { await save({isVisible: visible.checked}); }
        catch (failure) { error.textContent = failure?.message ?? String(failure); }
      });
      edit.addEventListener("click", () => {
        if (editCell.querySelector("form")) return;
        editCell.append(productForm(product, false, async (data, file, progress) => {
          await save(data);
          if (file) {
            product.imagePath = await uploadPhoto(snapshot.id, file, progress);
            await paintPhoto(photoCell, product);
          }
        }));
      });
      return row;
    }

    function renderAdminProducts() {
      const search = searchInput.value.toLocaleLowerCase();
      const entries = productEntries.filter(({product}) => {
        if (productFilter === "stock" && product.stock !== 0) return false;
        if (productFilter === "hidden" && product.isVisible !== false) return false;
        return String(product.name ?? "").toLocaleLowerCase().includes(search);
      });
      entries.sort((a, b) => {
        const names = String(a.product.name ?? "").localeCompare(String(b.product.name ?? ""), "ko");
        if (sortSelect.value === "name") return names || a.id.localeCompare(b.id);
        return (a.product.stock - b.product.stock) || names || a.id.localeCompare(b.id);
      });
      productsBody.replaceChildren(...entries.map(entry => entry.row));
      productsCount.textContent = `지금 보이는 상품 ${entries.length}개 / 전체 ${productEntries.length}개`;
    }

    for (const [filter, button] of filterButtons) {
      button.addEventListener("click", () => {
        productFilter = filter;
        for (const [value, control] of filterButtons) {
          control.setAttribute("aria-pressed", String(value === filter));
        }
        renderAdminProducts();
      });
    }
    searchInput.addEventListener("input", renderAdminProducts);
    sortSelect.addEventListener("change", renderAdminProducts);

    async function loadAdminProducts(expectedRevision) {
      productsStatus.textContent = "상품을 불러오고 있습니다.";
      try {
        const snapshot = await getDocsFromServer(collection(db, "products"));
        if (!productsAllowed || revision !== expectedRevision) return;
        productEntries = snapshot.docs.map(snapshot => {
          const product = snapshot.data();
          const row = productRow({ id: snapshot.id, data: () => product });
          return { id: snapshot.id, product, row };
        });
        renderAdminProducts();
        productsStatus.textContent = snapshot.empty ? "상품이 없습니다." : "";
      } catch (failure) {
        if (productsAllowed && revision === expectedRevision) {
          productsStatus.textContent = failure?.message ?? String(failure);
        }
      }
    }

    document.getElementById("new-product").addEventListener("click", () => {
      if (!productsAllowed || newEditor.querySelector("form")) return;
      newEditor.hidden = false;
      let createdProduct = null;
      newEditor.append(productForm({}, true, async (data, file, progress) => {
        if (!createdProduct) {
          createdProduct = await addDoc(collection(db, "products"), {
            ...data, isVisible: false, createdAt: serverTimestamp()
          });
        } else {
          await updateDoc(createdProduct, data);
        }
        if (file) await uploadPhoto(createdProduct.id, file, progress);
        await loadAdminProducts(revision);
      }));
    });

    grantButton.addEventListener("click", () => {
      if (!busy) void checkRole(true, true);
    });
    refreshButton.addEventListener("click", () => {
      if (!busy) void checkRole(true);
    });
    onAuthStateChanged(auth, () => { void checkRole(); }, showError);
  </script>
</body>
