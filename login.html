<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 하루상점</title>
  <link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
  <style>
    .auth-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn:disabled { opacity: .6; cursor: wait; }
    #auth-status { min-height: 1.75em; margin: 18px 0 0; }
  </style>

<body>

  <header class="site"><div class="wrap">
    <a class="brand" href="index.html">하루상점</a>
    <nav class="site"><a href="index.html">상품</a></nav>
  </div></header>
  <main><div class="wrap">
    <h1>로그인</h1>
    <form class="pay" id="auth-form" novalidate>
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="username">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <div class="auth-actions">
        <button class="btn ghost" id="sign-up" type="button" disabled>가입</button>
        <button class="btn" id="sign-in" type="submit" disabled>로그인</button>
        <button class="btn ghost" id="google-sign-in" type="button" disabled>Google로 계속하기</button>
        <button class="btn ghost" id="sign-out" type="button" disabled>로그아웃</button>
      </div>
      <p><a href="#" id="reset-password">비밀번호를 잊으셨나요?</a></p>
      <p><small>[같이 쓰는 컴퓨터에서는, 다 보신 뒤 로그아웃을 눌러 주세요.]</small></p>
      <p id="auth-status" role="status" aria-live="polite">인증을 준비하고 있습니다.</p>
    </form>
  </div></main>
  <script type="module">
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      auth, authReady, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, signInWithGoogle, logout, returnAfterLogin, sendVerificationEmail, authErrorMessage
    } from "./assets/auth.js";

    const form = document.getElementById("auth-form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const status = document.getElementById("auth-status");
    const buttons = [...form.querySelectorAll("button")];
    let busy = false;

    async function run(action, successMessage, afterSuccess) {
      if (busy) return;
      busy = true;
      buttons.forEach(button => { button.disabled = true; });
      status.textContent = "처리 중입니다.";
      try {
        await action();
        status.textContent = successMessage;
        if (afterSuccess) afterSuccess();
      } catch (error) {
        status.textContent = authErrorMessage(error);
      } finally {
        password.value = "";
        busy = false;
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    document.getElementById("sign-up").addEventListener("click", () => {
      run(async () => {
        const credential = await createUserWithEmailAndPassword(auth, email.value.trim(), password.value);
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ event: "sign_up", method: "email" });
        await sendVerificationEmail(credential.user);
      },
        "인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요.",
        () => returnAfterLogin(true));
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      run(async () => {
        await signInWithEmailAndPassword(auth, email.value.trim(), password.value);
        returnAfterLogin();
      },
        "로그인되었습니다.");
    });
    document.getElementById("google-sign-in").addEventListener("click", () => {
      run(() => signInWithGoogle(), "로그인되었습니다.", () => returnAfterLogin());
    });
    document.getElementById("sign-out").addEventListener("click", () => {
      run(() => logout(), "로그아웃되었습니다.");
    });

    document.getElementById("reset-password").addEventListener("click", event => {
      event.preventDefault();
      if (busy) return;
      const address = window.prompt("비밀번호 재설정 메일을 받을 이메일을 입력해 주세요.", email.value.trim());
      if (address === null) return;
      run(async () => {
        auth.languageCode = "ko";
        try {
          await sendPasswordResetEmail(auth, address.trim());
        } catch (error) {
          if (error.code !== "auth/user-not-found") throw error;
        }
      }, "메일을 보냈습니다. 가입된 주소라면 곧 도착합니다.");
    });

    authReady.then(user => {
      if (user && !busy) returnAfterLogin();
    }).catch(error => { status.textContent = authErrorMessage(error); });

    status.textContent = "이메일과 비밀번호를 입력해 주세요.";
    buttons.forEach(button => { button.disabled = false; });
  </script>
</body>
</html>
